<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Architecture map</title>
<style>
/* The app's own font, read from disk: the viewer opens from file://. */
@font-face { font-family: "Pretendard JP Variable"; src: url("../../../public/fonts/PretendardJPVariable.woff2") format("woff2"); font-weight: 400 600; font-display: swap; }
:root {
  color-scheme: light dark;
  --sans: "Pretendard JP Variable", system-ui, -apple-system, "Segoe UI", sans-serif;
  --bg: oklch(0.972 0.004 80); --surface: oklch(0.995 0.003 80); --raised: oklch(0.935 0.006 80);
  --line: oklch(0.22 0.01 70 / 0.13); --line-strong: oklch(0.22 0.01 70 / 0.34);
  --text: oklch(0.22 0.01 70); --dim: oklch(0.38 0.012 70); --muted: oklch(0.5 0.012 70);
  --accent: oklch(0.55 0.13 65); --accent-soft: oklch(0.55 0.13 65 / 0.45); --accent-faint: oklch(0.55 0.13 65 / 0.12);
  --request: oklch(0.5 0.1 200); --push: oklch(0.5 0.16 340); --add: oklch(0.5 0.13 150); --del: oklch(0.53 0.17 30);
  --zl: 0.47; --zc: 0.1; --zf: 7%; --zs: 32%; --h0: 245; --h1: 25; --h2: 140; --h3: 295;
}
/* Colors follow prefers-color-scheme; the viewer has no theme toggle. */
@media (prefers-color-scheme: dark) {
  :root {
    --bg: oklch(0.165 0.008 70); --surface: oklch(0.25 0.01 70); --raised: oklch(0.3 0.011 70);
    --line: oklch(0.97 0.01 80 / 0.18); --line-strong: oklch(0.97 0.01 80 / 0.4);
    --text: oklch(0.96 0.012 80); --dim: oklch(0.86 0.014 78); --muted: oklch(0.74 0.014 74);
    --accent: oklch(0.8 0.13 75); --accent-soft: oklch(0.8 0.13 75 / 0.45); --accent-faint: oklch(0.8 0.13 75 / 0.14);
    --request: oklch(0.8 0.09 200); --push: oklch(0.8 0.11 340); --add: oklch(0.82 0.14 150); --del: oklch(0.77 0.11 35);
    --zl: 0.84; --zc: 0.1; --zf: 13%; --zs: 55%;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); display: grid; grid-template-rows: auto 1fr; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding: 12px 24px; border-bottom: 1px solid var(--line); }
h1 { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; margin: 0 8px 0 0; }
h1 small { display: block; font-weight: 400; font-size: 12px; letter-spacing: 0; color: var(--muted); }
.seg { display: flex; gap: 2px; padding: 2px; border-radius: 10px; background: var(--raised); }
.seg button { font: inherit; font-size: 13px; color: var(--dim); background: none; border: 0; border-radius: 8px; padding: 5px 14px; cursor: pointer; transition: color .14s, background-color .14s; }
.seg button:hover { color: var(--text); }
.seg button:active { transform: scale(.98); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 600; }
select { font: inherit; font-size: 13px; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; max-width: 360px; }
button:focus-visible, select:focus-visible, summary:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent-soft); outline-offset: 2px; }
/* Desktop layout with a fixed 380 px panel: a developer tool opened beside the code. */
main { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 380px; min-height: 0; }
#stage { overflow: auto; padding: 20px 24px 64px; cursor: grab; }
#stage svg { user-select: none; -webkit-user-select: none; }
#panel { border-left: 1px solid var(--line); overflow: auto; padding: 20px 20px 28px; }
#panel h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.25; margin: 0 0 6px; }
#panel h3 { font-size: 13px; font-weight: 600; margin: 22px 0 8px; }
#panel p { margin: 0 0 8px; color: var(--dim); }
.group { background: var(--surface); border-radius: 12px; overflow: hidden; }
.row { padding: 9px 12px; }
.row + .row { border-top: 1px solid var(--line); }
.row b { font-weight: 600; }
#panel a { color: var(--accent); }
.ex { margin-top: 10px; }
.row > .ex:first-child { margin-top: 0; }
code { font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-word; }
.ex > code { display: block; margin: 2px 0; }
.meta { color: var(--muted); font-size: 12px; }
summary { display: flex; align-items: baseline; gap: 6px; cursor: pointer; list-style: none; border-radius: 6px; }
summary::-webkit-details-marker { display: none; }
summary::after { content: ""; flex: none; align-self: center; margin-left: auto; width: 6px; height: 6px; border: solid var(--muted); border-width: 0 1.5px 1.5px 0; transform: rotate(-45deg); transition: transform .14s; }
details[open] > summary::after { transform: rotate(45deg); }
.tag { display: inline-block; font-size: 11px; font-weight: 500; border-radius: 999px; padding: 0 7px; margin-left: 4px; }
.tag.request { color: var(--request); background: color-mix(in oklch, var(--request) 14%, transparent); }
.tag.push { color: var(--push); background: color-mix(in oklch, var(--push) 14%, transparent); }
.added { color: var(--add); } .removed { color: var(--del); } .changed { color: var(--dim); }
.legend { max-width: 78ch; font-size: 12px; color: var(--muted); margin: 14px 0 0; }
.zone, .zc { --z: oklch(var(--zl) var(--zc) var(--h)); }
.zc { color: var(--z); }
svg { display: block; }
svg text { fill: var(--text); font: 12px var(--sans); }
.box { cursor: pointer; }
.box rect { fill: var(--surface); stroke: var(--line); stroke-width: 1; transition: stroke .14s; }
.box:hover rect { stroke: var(--line-strong); }
.box.external rect { fill: none; stroke: var(--line-strong); stroke-dasharray: 4 3; }
.box.person rect { fill: var(--raised); }
.box .name { font-weight: 600; font-size: 14px; }
.box .kind { fill: var(--muted); font-size: 11px; }
.box .rel { fill: var(--dim); font-size: 11px; font-weight: 600; }
.box .desc { color: var(--dim); font: 12px/1.3 var(--sans); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
.box.sel rect { fill: var(--surface); stroke: var(--accent); stroke-width: 2; stroke-dasharray: none; }
.dim { opacity: .3; }
.link path { stroke: var(--dim); stroke-width: 1.4; fill: none; }
.link.on path { stroke: var(--accent); stroke-width: 2; }
.lbl { font: 11.5px/1.25 var(--sans); color: var(--text); background: var(--bg); border-radius: 4px; padding: 1px 4px; text-align: center; display: inline-block; }
.link.on .lbl { color: var(--text); }
.zone rect { fill: color-mix(in oklch, var(--z) var(--zf), transparent); stroke: color-mix(in oklch, var(--z) var(--zs), transparent); }
.zone .zt { fill: var(--z); font-size: 13.5px; font-weight: 600; }
.zone .zbar { fill: var(--z); stroke: none; }
.zone .zn { font: 11.5px/1.2 var(--sans); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.life { stroke: var(--line-strong); stroke-dasharray: 2 5; }
.msg { cursor: pointer; }
.msg path { stroke: var(--dim); stroke-width: 1.4; fill: none; }
.msg circle { fill: var(--dim); }
.msg text { paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.msg.request path { stroke: var(--request); } .msg.request circle { fill: var(--request); }
.msg.push path { stroke: var(--push); } .msg.push circle { fill: var(--push); }
.msg.sel path { stroke-width: 2.2; } .msg.sel text { font-weight: 600; stroke: none; }
.msg .band { fill: var(--accent-faint); }
.num { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.note rect { fill: var(--raised); stroke: none; }
.note.sel rect { stroke: var(--accent); stroke-width: 2; }
.note div { font: 11.5px/1.35 var(--sans); color: var(--text); padding: 5px 10px; }
.frame { --t: var(--request); }
.frame.push { --t: var(--push); }
.frame rect { fill: color-mix(in oklch, var(--t) 8%, transparent); stroke: color-mix(in oklch, var(--t) 40%, transparent); }
.frame text { font-size: 11px; font-weight: 600; fill: var(--t); }
.msg .badge { fill: var(--bg); stroke: var(--muted); }
.link.on .badge { stroke: var(--accent); }
.msg .count { font-size: 11px; font-weight: 600; stroke: none; }
#zoom { position: absolute; left: 24px; bottom: 16px; box-shadow: 0 8px 32px oklch(0.12 0.02 70 / 0.25); }
#zoom button { padding: 5px 11px; font-variant-numeric: tabular-nums; }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } }
@keyframes fade { from { opacity: 1; } }
@keyframes travel { to { stroke-dashoffset: -14; } }
#stage svg.enter { animation: enter .28s cubic-bezier(0.22, 1, 0.36, 1); }
#panel > * { animation: enter .22s cubic-bezier(0.22, 1, 0.36, 1) both; }
svg.fresh .dim { animation: fade .25s; }
.link.on path, .msg.sel path { stroke-dasharray: 8 6; animation: travel .7s linear infinite; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header>
  <h1><span id="title">Architecture map</span><small id="sub"></small></h1>
  <!-- No text search: the flow select and the transport filter are the navigation; modules are picked on the drawing. -->
  <div class="seg" id="views"></div>
  <select id="flows" aria-label="Flow" hidden></select>
  <div class="seg" id="transports" hidden></div>
  <div class="seg" id="compare" hidden></div>
</header>
<main><div id="stage"></div><aside id="panel"></aside>
  <div class="seg" id="zoom"><button data-z="out" aria-label="Zoom out">−</button><button data-z="fit" id="zlabel" aria-label="Fit to width"></button><button data-z="in" aria-label="Zoom in">+</button></div>
</main>
<script>
const NS = "http://www.w3.org/2000/svg";
const state = { view: "overview", flow: "", sel: "", step: -1, transport: "all", compare: false, zoom: null };
let DATA, BASE, mod, nodeModule, pairs;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function el(tag, attrs = {}, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.append(e); return e; }
function html(parent, x, y, w, h, inner) { const f = el("foreignObject", { x, y, width: w, height: h }, parent); f.innerHTML = `<div xmlns="http://www.w3.org/1999/xhtml">${inner}</div>`; return f; }
function marker(defs, id, color) { const m = el("marker", { id, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 9, markerHeight: 9, orient: "auto-start-reverse", markerUnits: "userSpaceOnUse" }, defs); el("path", { d: "M0 0L10 5L0 10z", fill: color }, m); }
function load(src, done) { const s = document.createElement("script"); s.src = src; s.onload = () => done(true); s.onerror = () => done(false); document.head.append(s); }
const hue = id => `--h:var(--h${DATA.zones.findIndex(z => z.id === id) % 4})`;
const repoUrl = x => `https://github.com/yw0nam/YUI/${/\.[^/]+$/.test(x) ? "blob" : "tree"}/main/${x.split("/").map(encodeURIComponent).join("/")}`;
const group = rows => `<div class="group">${rows}</div>`;
const tagOf = t => t === "request" || t === "push" ? ` <span class="tag ${t}">${t}</span>` : "";
function edgeRow(e, names) {
  const ends = names ? `<b>${esc(names[e.from])} → ${esc(names[e.to])}</b>` : "";
  return `<div class="ex">${ends}<code>${esc(e.carries)}</code><div class="meta">${esc(e.kind)}${tagOf(e.transport)}</div>${e.wiring ? `<div class="meta">wired in <code>${esc(e.wiring)}</code></div>` : ""}</div>`;
}

// ---------- overview ----------
const BW = 172, BH = 86, CW = 268, RH = 158, X0 = 14, Y0 = 92, ZP = 14, ZT = 40;
function place() {
  const rows = Math.max(...DATA.modules.map(m => m.row)), pos = {};
  for (const m of DATA.modules) pos[m.id] = { x: X0 + m.col * CW, y: Y0 + m.row * RH, w: BW, h: m.kind === "person" ? rows * RH + BH : BH };
  return pos;
}
function clip(a, b) {
  const ax = a.x + a.w / 2, ay = a.y + a.h / 2, dx = b.x + b.w / 2 - ax, dy = b.y + b.h / 2 - ay;
  const t = Math.min(dx ? a.w / 2 / Math.abs(dx) : 9, dy ? a.h / 2 / Math.abs(dy) : 9);
  return [ax + dx * t, ay + dy * t];
}
function related(id) {
  const rel = {};
  for (const key in pairs) { const [f, t] = key.split(">"); if (f === id) rel[t] = rel[t] === "in" ? "both" : "out"; if (t === id) rel[f] = rel[f] === "out" ? "both" : "in"; }
  return rel;
}
function overview(stage) {
  const pos = place(), cols = Math.max(...DATA.modules.map(m => m.col)), rows = Math.max(...DATA.modules.map(m => m.row));
  const w = X0 * 2 + cols * CW + BW + 16, h = Y0 + rows * RH + BH + 30, diff = state.compare ? difference() : null;
  const svg = el("svg", { viewBox: `0 0 ${w} ${h}`, role: "group", "aria-label": "Core modules and the main paths between them" }, stage);
  const defs = el("defs", {}, svg); marker(defs, "ah", "var(--dim)"); marker(defs, "ah-on", "var(--accent)");
  for (const z of DATA.zones) {
    const ps = DATA.modules.filter(m => m.zone === z.id).map(m => pos[m.id]); if (!ps.length) continue;
    const x = Math.min(...ps.map(p => p.x)) - ZP, y = Math.min(...ps.map(p => p.y)) - ZT, x2 = Math.max(...ps.map(p => p.x + p.w)) + ZP, y2 = Math.max(...ps.map(p => p.y + p.h)) + ZP;
    const g = el("g", { class: "zone", style: hue(z.id) }, svg);
    el("rect", { x, y, width: x2 - x, height: y2 - y, rx: 14 }, g);
    el("text", { x: x + 12, y: y + 18, class: "zt" }, g).textContent = z.title;
    html(g, x + 12, y + 21, x2 - x - 20, 18, `<div class="zn">${esc(z.note)}</div>`);
  }
  const rel = state.sel ? related(state.sel) : {};
  const twoWay = new Set(DATA.links.filter(l => DATA.links.some(o => o.from === l.to && o.to === l.from)).map(l => l.from + ">" + l.to));
  for (const l of DATA.links) {
    const a = pos[l.from], b = pos[l.to]; let [x1, y1] = clip(a, b), [x2, y2] = clip(b, a);
    if (l.fromPort) { x1 = a.x + a.w * l.fromPort[0]; y1 = a.y + a.h * l.fromPort[1]; x2 = b.x + b.w * l.toPort[0]; y2 = b.y + b.h * l.toPort[1]; }
    const len = Math.hypot(x2 - x1, y2 - y1), nx = -(y2 - y1) / len, ny = (x2 - x1) / len, off = twoWay.has(l.from + ">" + l.to) ? 13 : 0;
    x1 += nx * off; y1 += ny * off; x2 += nx * off; y2 += ny * off;
    const on = state.sel && (l.from === state.sel || l.to === state.sel);
    const g = el("g", { class: "link" + (on ? " on" : "") + (state.sel && !on ? " dim" : "") }, svg), end = `url(#${on ? "ah-on" : "ah"})`;
    const label = (x, y, bw, bh, align, justify) => html(g, x, y, bw, bh, `<div style="display:flex;height:${bh}px;align-items:${align};justify-content:${justify}"><span class="lbl">${esc(l.label)}</span></div>`);
    if (l.arc) {
      const ax = a.x + a.w * .85, bx = b.x + b.w * .85, top = Y0 - ZT - 26, s = bx < ax ? -1 : 1;
      el("path", { d: `M${ax} ${a.y - ZT}V${top + 12}Q${ax} ${top} ${ax + 12 * s} ${top}H${bx - 12 * s}Q${bx} ${top} ${bx} ${top + 12}V${b.y - 2}`, "marker-end": end }, g);
      label((ax + bx) / 2 - 150, top - 12, 300, 24, "center", "center"); continue;
    }
    el("path", { d: `M${x1} ${y1}L${x2} ${y2}`, "marker-end": end }, g);
    const horizontal = Math.abs(y2 - y1) < 2, vertical = Math.abs(x2 - x1) < 2;
    if (horizontal) { const below = off && ny > 0, bw = Math.max(60, Math.abs(x2 - x1) - 8), bh = 64; label((x1 + x2) / 2 - bw / 2, below ? y1 + 5 : y1 - bh - 5, bw, bh, below ? "flex-start" : "flex-end", "center"); }
    else if (vertical) label(off ? (nx > 0 ? x1 + 6 : x1 - 156) : x1 - 75, (y1 + y2) / 2 - 20, 150, 40, "center", off ? (nx > 0 ? "flex-start" : "flex-end") : "center");
    else label(x1 + (x2 - x1) * .38 - 65 + (x2 > x1 ? 34 : -34), y1 + (y2 - y1) * .38 - 20, 130, 40, "center", "center");
  }
  for (const m of DATA.modules) {
    const p = pos[m.id], r = rel[m.id], mark = diff && diff.moduleMark[m.id];
    const cls = ["box", m.kind, state.sel === m.id ? "sel" : "", r ? "rel-" + r : "", state.sel && state.sel !== m.id && !r ? "dim" : ""].join(" ");
    const g = el("g", { class: cls, tabindex: 0, role: "button", "aria-label": m.label, "aria-pressed": state.sel === m.id }, svg);
    el("rect", { x: p.x, y: p.y, width: p.w, height: p.h, rx: 10 }, g);
    el("text", { x: p.x + 12, y: p.y + 21, class: "name" }, g).textContent = (mark ? mark + " " : "") + m.label;
    el("text", { x: p.x + p.w - 10, y: p.y + 20, class: "kind", "text-anchor": "end" }, g).textContent = m.kind === "module" ? "" : m.kind === "shell" ? "Rust" : m.kind;
    html(g, p.x + 12, p.y + 28, p.w - 22, p.h - 34, `<div class="desc" style="-webkit-line-clamp:${r ? 2 : m.kind === "person" ? 12 : 3}">${esc(m.desc)}</div>`);
    if (r) el("text", { x: p.x + p.w - 10, y: p.y + BH - 8, class: "rel", "text-anchor": "end" }, g).textContent = { in: "sends to selection", out: "receives from selection", both: "both ways" }[r];
    const pick = () => { state.sel = state.sel === m.id ? "" : m.id; render(); };
    g.addEventListener("click", pick); g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
  }
  const lg = document.createElement("p"); lg.className = "legend";
  lg.textContent = "A tinted area groups modules by role. A dashed box sits outside the repo. A line is a main path, labelled with what crosses in the direction of the arrow. Select a module for every exchange.";
  stage.append(lg);
}
function exchangeRows(id, dir) {
  const names = Object.fromEntries(DATA.nodes.map(n => [n.id, n.label]));
  const rows = Object.keys(pairs).filter(k => k.split(">")[dir === "out" ? 0 : 1] === id).map(k => {
    const other = k.split(">")[dir === "out" ? 1 : 0], items = pairs[k];
    return `<details class="row"><summary><span class="meta">${dir === "out" ? "→" : "←"}</span><b>${esc(mod[other].label)}</b><span class="meta">${items.length} exchange${items.length > 1 ? "s" : ""}</span></summary>${items.map(e => edgeRow(e, names)).join("")}</details>`;
  }).join("");
  return rows ? group(rows) : "<p>None.</p>";
}
function overviewPanel(panel) {
  if (state.compare) { panel.innerHTML = differencePanel(); return; }
  if (!state.sel) {
    panel.innerHTML = `<h2>Core modules</h2><p>A line is a main path of data and its label says what crosses. Select a module to see what it is made of and everything it exchanges with the others.</p><h3>Groups</h3>${group(DATA.zones.map(z => `<div class="row"><b class="zc" style="${hue(z.id)}">${esc(z.title)}</b><div class="meta">${esc(z.note)}</div></div>`).join(""))}`;
    return;
  }
  const m = mod[state.sel], parts = DATA.nodes.filter(n => n.module === m.id && n.paths.length), maps = DATA.nodes.filter(n => n.module === m.id && n.map), names = Object.fromEntries(DATA.nodes.map(n => [n.id, n.label]));
  const claims = DATA.nodes.flatMap(n => n.paths), shared = x => claims.some(c => c.startsWith(x + "/")) ? " <span class=\"meta\">files outside the folders of other parts</span>" : "";
  const within = DATA.edges.filter(e => nodeModule[e.from] === m.id && nodeModule[e.to] === m.id);
  panel.innerHTML = `<h2>${esc(m.label)}</h2><p>${esc(m.desc)}</p>
  <h3>Made of</h3>${parts.length ? group(parts.map(p => `<details class="row"><summary><b>${esc(p.label)}</b></summary><div class="meta" style="margin-top:4px">${esc(p.role)}</div>${p.paths.map(x => `<div><a href="${esc(repoUrl(x))}" target="_blank" rel="noopener"><code>${esc(x)}</code></a>${shared(x)}</div>`).join("")}</details>`).join("")) : "<p>Outside the repo.</p>"}${maps.map(p => `<p><a href="?map=${encodeURIComponent(p.map)}">Open the map of ${esc(p.label)}</a></p>`).join("")}
  <h3>Sends to</h3>${exchangeRows(m.id, "out")}<h3>Receives from</h3>${exchangeRows(m.id, "in")}${within.length ? `<h3>Between its parts</h3>${group(`<details class="row"><summary><b>${within.length} exchange${within.length > 1 ? "s" : ""}</b></summary>${within.map(e => edgeRow(e, names)).join("")}</details>`)}` : ""}`;
}

// ---------- flow (sequence) ----------
const currentFlow = () => DATA.flows.find(f => f.id === state.flow) || DATA.flows[0];
const visibleSteps = () => currentFlow().steps.filter(s => state.transport === "all" || !s.transport || s.transport === state.transport);
function participants(steps) {
