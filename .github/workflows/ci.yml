name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # web and lint run on every pull request: they are required checks of the main ruleset, and a workflow-level path filter would leave them pending.
  web:
    name: web (tsc + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build # tsc typecheck + vite build
      - run: pnpm typecheck:test # tsc over tsconfig.test.json, which includes src/ so fixtures type-check against the real sources
      - run: pnpm test # vitest run
      - run: pnpm map:check # architecture map matches the tree
      - run: pnpm docs:build # vitepress build + dead-link check

  web-windows-python:
    name: web-windows (Python command + producers)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: chg
        with:
          filters: |
            python:
              - 'integrations/skills/yui-daily-briefing/**'
              - 'tests/yui-daily-briefing-producers.test.ts'
              - 'tests/python-command*.ts'
              - 'tests/command-paths.ts'
              - '.github/workflows/ci.yml'
      - uses: pnpm/action-setup@v4
        if: github.event_name != 'pull_request' || steps.chg.outputs.python == 'true'
      - uses: actions/setup-node@v4
        if: github.event_name != 'pull_request' || steps.chg.outputs.python == 'true'
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        if: github.event_name != 'pull_request' || steps.chg.outputs.python == 'true'
        with:
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile
        if: github.event_name != 'pull_request' || steps.chg.outputs.python == 'true'
      - name: Run producer tests with the default command
        shell: pwsh
        if: github.event_name != 'pull_request' || steps.chg.outputs.python == 'true'
        run: |
          Remove-Item Env:YUI_PYTHON -ErrorAction SilentlyContinue
          pnpm exec vitest run tests/python-command-windows.test.ts tests/yui-daily-briefing-producers.test.ts
      - name: Run producer tests with an explicit Python override
        shell: pwsh
        if: github.event_name != 'pull_request' || steps.chg.outputs.python == 'true'
        run: |
          $python = (& python -c "import sys; print(sys.executable)").Trim()
          if (-not $python) { throw "Python executable path was empty" }
          $env:YUI_PYTHON = $python
          pnpm exec vitest run tests/python-command-windows.test.ts tests/yui-daily-briefing-producers.test.ts

  lint:
    name: lint (biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint # biome check (format + lint)

  test-guard:
    name: test-guard (tests accompany source)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so we can diff against the PR base
      - name: Enforce that source changes ship tests
        env:
          GH_TOKEN: ${{ github.token }}
        # Labels are read at run time, so re-running the job picks up a label added after the PR opened.
        run: |
          skip=
          if gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq '.labels[].name' | grep -qx skip-tests; then
            skip=1
          fi
          TEST_GUARD_SKIP="$skip" bash scripts/ci/test-guard.sh "origin/${{ github.event.pull_request.base.ref }}"

  pr-title:
    name: pr-title (conventional + english)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Conventional-commit type set; PR titles become squash-merge commit subjects.
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          # Tracker content is English: the subject must be printable ASCII.
          subjectPattern: ^[\x20-\x7E]+$
          subjectPatternError: |
            The PR title subject must be written in English (printable ASCII).
            GitHub tracker content is English-only (AGENTS.md).

      - name: PR body carries no AI attribution
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$BODY" | grep -qiE 'Co-Authored-By|Claude-Session|Generated with|🤖'; then
            echo '::error::The PR body carries an AI attribution line (AGENTS.md § No AI attribution). Remove it, then push a commit or close and reopen the PR: a rerun replays the event payload and keeps reading the old body. The squash commit is built from this body.'
            exit 1
          fi

  rust:
    name: rust (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: chg
        with:
          filters: |
            rust:
              - 'src-tauri/**'
              - '.github/workflows/ci.yml'
      # 28 s of this job on main (run 38855786059); no apt cache.
      # Tauri v2 Linux build dependencies (official prerequisites, Ubuntu 24.04).
      - name: Install Tauri system deps
        if: github.event_name != 'pull_request' || steps.chg.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        if: github.event_name != 'pull_request' || steps.chg.outputs.rust == 'true'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: github.event_name != 'pull_request' || steps.chg.outputs.rust == 'true'
        with:
          workspaces: src-tauri
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
        if: github.event_name != 'pull_request' || steps.chg.outputs.rust == 'true'
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
        if: github.event_name != 'pull_request' || steps.chg.outputs.rust == 'true'
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
        if: github.event_name != 'pull_request' || steps.chg.outputs.rust == 'true'

  rust-windows:
    name: rust-windows (cargo check)
    runs-on: windows-latest
    # Windows-only sources (os_event_watcher/windows.rs) are invisible to the Linux job,
    # so they get their own compile pass. A native runner, not a cross-check: the aws-lc-sys
    # build script compiles C for the target and needs the MSVC toolchain. check, not test —
    # the goal is compile coverage; behavior is covered by the Linux job.
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: chg
        with:
          filters: |
            rust:
              - 'src-tauri/**'
              - '.github/workflows/ci.yml'
      - uses: dtolnay/rust-toolchain@stable
        if: github.event_name != 'pull_request' || steps.chg.outputs.rust == 'true'
      - uses: Swatinem/rust-cache@v2
        if: github.event_name != 'pull_request' || steps.chg.outputs.rust == 'true'
        with:
          workspaces: src-tauri
      - run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets --locked
        if: github.event_name != 'pull_request' || steps.chg.outputs.rust == 'true'

  # Runs unfiltered: 42 s on main (run 38855786059) and not a required check.
  mods:
    name: mods (uv + pytest)
    runs-on: ubuntu-latest
    # Each tracked pyproject.toml folder is a self-contained uv project; OS calls are mocked, so they run on Linux.
    # One job over all projects (sequential, grouped logs) — a failure doesn't skip the rest.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync + test each Python project
        run: |
          rc=0
          found=0
          while IFS= read -r -d '' file; do
            project=$(dirname "$file")
            found=$((found + 1))
            echo "::group::$project"
            (cd "$project" && uv sync --frozen && uv run pytest) || rc=1
            echo "::endgroup::"
          done < <(git ls-files -z -- ':(glob)**/pyproject.toml')
          if [ "$found" -eq 0 ]; then
            echo "::error::no tracked pyproject.toml"
            exit 1
          fi
          exit $rc

  mods-lint:
    name: mods-lint (ruff)
    runs-on: ubuntu-latest
    # Python lint is ruff-only (format + check), enforced over all projects in one job.
    # Projects are the folders that track a pyproject.toml.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Ruff format + check each Python project
        run: |
          rc=0
          found=0
          while IFS= read -r -d '' file; do
            project=$(dirname "$file")
            found=$((found + 1))
            echo "::group::$project"
            (cd "$project" && uv sync --frozen && uv run ruff format --check . && uv run ruff check .) || rc=1
            echo "::endgroup::"
          done < <(git ls-files -z -- ':(glob)**/pyproject.toml')
          if [ "$found" -eq 0 ]; then
            echo "::error::no tracked pyproject.toml"
            exit 1
          fi
          exit $rc
