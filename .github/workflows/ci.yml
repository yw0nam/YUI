name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (tsc + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build # tsc 타입체크 + vite build
      - run: pnpm typecheck:test # tsc 타입체크 (테스트 파일 포함)
      - run: pnpm test # vitest run
      - run: pnpm docs:build # vitepress build + dead-link check

  lint:
    name: lint (biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint # biome check (format + lint)

  test-guard:
    name: test-guard (tests accompany source)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so we can diff against the PR base
      - name: Enforce that source changes ship tests
        env:
          TEST_GUARD_SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'skip-tests') && '1' || '' }}
        run: bash scripts/ci/test-guard.sh "origin/${{ github.event.pull_request.base.ref }}"

  pr-title:
    name: pr-title (conventional + english)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Conventional-commit type set; PR titles become squash-merge commit subjects.
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          # Tracker content is English: the subject must be printable ASCII.
          subjectPattern: ^[\x20-\x7E]+$
          subjectPatternError: |
            The PR title subject must be written in English (printable ASCII).
            GitHub tracker content is English-only (AGENTS.md).

  rust:
    name: rust (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: chg
        with:
          filters: |
            rust:
              - 'src-tauri/**'
              - '.github/workflows/ci.yml'
      # Tauri v2 Linux 빌드 의존성 (공식 prerequisites, Ubuntu 24.04).
      - name: Install Tauri system deps
        if: github.event_name != 'pull_request' || steps.chg.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        if: github.event_name != 'pull_request' || steps.chg.outputs.rust == 'true'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: github.event_name != 'pull_request' || steps.chg.outputs.rust == 'true'
        with:
          workspaces: src-tauri
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
        if: github.event_name != 'pull_request' || steps.chg.outputs.rust == 'true'
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
        if: github.event_name != 'pull_request' || steps.chg.outputs.rust == 'true'
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
        if: github.event_name != 'pull_request' || steps.chg.outputs.rust == 'true'

  rust-windows:
    name: rust-windows (cargo check)
    runs-on: windows-latest
    # Windows-only sources (os_event_watcher/windows.rs) are invisible to the Linux job,
    # so they get their own compile pass. A native runner, not a cross-check: the aws-lc-sys
    # build script compiles C for the target and needs the MSVC toolchain. check, not test —
    # the goal is compile coverage; behavior is covered by the Linux job.
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: chg
        with:
          filters: |
            rust:
              - 'src-tauri/**'
              - '.github/workflows/ci.yml'
      - uses: dtolnay/rust-toolchain@stable
        if: github.event_name != 'pull_request' || steps.chg.outputs.rust == 'true'
      - uses: Swatinem/rust-cache@v2
        if: github.event_name != 'pull_request' || steps.chg.outputs.rust == 'true'
        with:
          workspaces: src-tauri
      - run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets --locked
        if: github.event_name != 'pull_request' || steps.chg.outputs.rust == 'true'

  mods:
    name: mods (uv + pytest)
    runs-on: ubuntu-latest
    # Each Mod is a self-contained uv project; OS calls are mocked, so they run on Linux.
    # One job over all mods (sequential, grouped logs) — a failing mod doesn't skip the rest.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync + test each mod
        run: |
          rc=0
          for mod in desktop-control shell-sandbox avatar router; do
            echo "::group::$mod"
            (cd "Mods/$mod" && uv sync --frozen && uv run pytest) || rc=1
            echo "::endgroup::"
          done
          exit $rc

  mods-lint:
    name: mods-lint (ruff)
    runs-on: ubuntu-latest
    # Python lint is ruff-only (format + check), enforced over all mods in one job.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Ruff format + check each mod
        run: |
          rc=0
          for mod in desktop-control shell-sandbox avatar router; do
            echo "::group::$mod"
            (cd "Mods/$mod" && uv sync --frozen && uv run ruff format --check . && uv run ruff check .) || rc=1
            echo "::endgroup::"
          done
          exit $rc
