name: Refresh VRT references

on:
  workflow_dispatch:

jobs:
  update:
    name: vrt references (Linux WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps webkit
        timeout-minutes: 10
      - run: pnpm exec vitest run --project vrt --update
      - run: find src -name '*-webkit-linux.png' -path '*__screenshots__*' -print0 | tar --null -czf vrt-references.tgz -T -
      - uses: actions/upload-artifact@v4
        with:
          name: vrt-references
          path: vrt-references.tgz
