name: Refresh VRT references

on:
  workflow_dispatch:

jobs:
  update:
    name: vrt references (Linux WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps webkit
      - run: pnpm exec vitest run --project vrt --update
      - uses: actions/upload-artifact@v4
        with:
          name: vrt-references
          path: src/**/__screenshots__/**/*-linux.png
