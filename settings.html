<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YUI 설정</title>
    <style>
      /* The settings window is a real OS window (not a transparent overlay) — fill it with the scrim's opaque sibling color.
         styles.css leaves body transparent, so override it with !important. */
      html,
      body {
        background: oklch(0.16 0.014 70) !important;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/settings-main.ts"></script>
  </body>
</html>
