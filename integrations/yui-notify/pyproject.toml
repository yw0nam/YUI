[project]
name = "yui-notify"
version = "0.1.0"
description = "Claude Code and Codex hooks that post coding-agent Threads."
requires-python = ">=3.10"
dependencies = ["anyio", "mcp==2.3.0", "mcp-types==2.3.0", "pydantic"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["scripts", "channel"]
pythonpath = [".", "scripts"]

[tool.ruff]
line-length = 110
target-version = "py39"
