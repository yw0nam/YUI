[project]
name = "yui-notify"
version = "0.1.0"
description = "Claude Code and Codex hooks that tell a YUI character when an agent finished or needs input."
requires-python = ">=3.9"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["scripts"]

[tool.ruff]
line-length = 110
target-version = "py39"
