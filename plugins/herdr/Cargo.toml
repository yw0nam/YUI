[package]
name = "herdr"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[dependencies]
rmcp = { version = "3.8", default-features = false, features = ["server", "transport-io"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
rmcp = { version = "3.8", default-features = false, features = ["client"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
