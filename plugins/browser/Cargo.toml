[package]
name = "browser"
version = "0.1.1"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rmcp = { version = "3.8", default-features = false, features = ["server", "transport-io"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
rmcp = { version = "3.8", default-features = false, features = ["client"] }
