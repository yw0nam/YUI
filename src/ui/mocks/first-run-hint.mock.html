<!doctype html>
<!-- mock: issue #320 first-run onboarding hint. NOT a new surface — the character
     "says" the hint once via the existing .yui-bubble, then it auto-fades on the
     normal dwell timer. No dismiss button, no overlay, no card, no new chrome. -->
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>YUI — first-run hint mock</title>
<style>
  /* Subset of tokens.css — Hearthlight, OKLCH only. */
  :root {
    --yui-accent: oklch(0.8 0.13 75);
    --yui-text: oklch(0.95 0.012 80);
    --yui-text-dim: oklch(0.78 0.016 75);
    --yui-text-mute: oklch(0.66 0.014 72);
    --yui-scrim: oklch(0.21 0.014 70 / 0.64);
    --yui-edge: oklch(0.97 0.01 80 / 0.1);
    --yui-edge-strong: oklch(0.97 0.01 80 / 0.16);
    --yui-float: 0 8px 32px oklch(0.12 0.02 70 / 0.4);
    --yui-text-shadow: 0 1px 2px oklch(0.1 0.01 70 / 0.55);
    --yui-radius: 14px;
    --yui-ease: cubic-bezier(0.22, 1, 0.36, 1);
    --yui-dur: 200ms;
  }

  /* desktop backdrop stand-in — pet-window viewport is the realistic case.
     position:relative so .yui-bubble's absolute bottom/left resolve against the
     real viewport, matching surfaces.css. */
  html, body {
    height: 100%;
  }
  body {
    position: relative;
    margin: 0;
    background:
      radial-gradient(60% 50% at 30% 20%, oklch(0.5 0.08 250 / 0.7), transparent),
      radial-gradient(50% 60% at 80% 70%, oklch(0.55 0.1 30 / 0.6), transparent),
      oklch(0.35 0.02 250);
    font-family: -apple-system, "Helvetica Neue", sans-serif;
  }

  /* ── speech bubble — copied verbatim from surfaces.css (.yui-bubble / __sr) ── */
  .yui-bubble {
    position: absolute;
    bottom: var(--yui-bubble-bottom, 16%);
    left: 50%;
    transform: translate(-50%, 6px) scale(0.98);
    width: max-content;
    max-width: min(34ch, 78%);

    padding: 0.7rem 0.95rem;
    border-radius: var(--yui-radius);
    background: var(--yui-scrim);
    border: 1px solid var(--yui-edge);
    box-shadow: var(--yui-float);
    backdrop-filter: blur(10px) saturate(1.1);
    -webkit-backdrop-filter: blur(10px) saturate(1.1);

    color: var(--yui-text);
    font-size: 0.95rem;
    line-height: 1.5;
    text-wrap: pretty;
    text-shadow: var(--yui-text-shadow);

    opacity: 0;
    pointer-events: none;
    transition:
      opacity var(--yui-dur) var(--yui-ease),
      transform var(--yui-dur) var(--yui-ease);
  }
  .yui-bubble.is-visible {
    opacity: 1;
    transform: translate(-50%, 0) scale(1);
  }
  .yui-bubble__sr {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

  /* 힌트 안의 단축키 표기 — surfaces에 새 칩을 만들지 않고 quick-controls.css의
     .yui-*__rename-hint kbd 패턴을 그대로 따른다: 박스/보더/앰버 없이 인라인
     굵기+dim 색만. 앰버 예산(≤10%)에 전혀 손대지 않는 조용한 선택. */
  .yui-bubble kbd {
    font-family: inherit;
    font-weight: 650;
    color: var(--yui-text-dim);
  }

  /* ── mock harness chrome (not part of the real surface) ── */
  .hint {
    position: fixed;
    top: 1rem;
    left: 1rem;
    color: var(--yui-text-dim);
    font-size: 0.8rem;
    line-height: 1.6;
    max-width: 60ch;
  }
  .hint button {
    font-size: 0.8rem;
    padding: 0.3rem 0.6rem;
  }
</style>
</head>
<body>
  <div class="hint">
    mock: first-run hint riding the existing speech bubble. Real trigger is a
    one-time onboarding fire; here a button replays fade-in → 5s dwell (the
    surface default, <code>DEFAULT_DWELL</code> in surfaces.ts) → fade-out.<br />
    <button type="button" id="replay">replay fade-in → dwell → fade-out</button>
  </div>

  <div class="yui-bubble is-visible" id="bubble" role="status">
    우클릭하면 컨트롤이 열려요 · <kbd>⌘⇧Y</kbd>로 말 걸 수 있어요
    <span class="yui-bubble__sr">
      <!-- en: Right-click me for controls · press ⌘⇧Y to talk -->
      <!-- ja: 右クリックでコントロール · ⌘⇧Yで話しかけてね -->
      우클릭하면 컨트롤이 열려요 · ⌘⇧Y로 말 걸 수 있어요
    </span>
  </div>

  <script>
    const bubble = document.getElementById("bubble");
    const DWELL_MS = 5000; // matches DEFAULT_DWELL in surfaces.ts

    document.getElementById("replay").addEventListener("click", () => {
      bubble.classList.remove("is-visible");
      // force a reflow so the re-added class re-triggers the transition
      // instead of no-op'ing against the class already being present.
      void bubble.offsetWidth;
      requestAnimationFrame(() => {
        bubble.classList.add("is-visible");
        setTimeout(() => bubble.classList.remove("is-visible"), DWELL_MS);
      });
    });
  </script>
</body>
</html>
