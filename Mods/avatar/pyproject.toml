[project]
name = "avatar"
version = "0.1.0"
description = "YUI Mod — query the avatar's own body state and move it with semantic verbs"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.2.4",
    "loguru>=0.7",
]

[project.scripts]
avatar-mcp = "avatar.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["avatar"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
