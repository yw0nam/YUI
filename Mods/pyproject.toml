[project]
name = "yui-mods"
version = "0.1.0"
description = "YUI Mods — standalone MCP servers exposing host capabilities to the backend agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.2.4",
    "loguru>=0.7",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
    # router imports these directly (already present via fastmcp's HTTP transport)
    "starlette",
    "httpx",
    "uvicorn",
]

[project.scripts]
desktop-control-mcp = "mcp_server.desktop_control.server:main"
mods-router = "mcp_server.router:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["test"]
