[project]
name = "desktop-control"
version = "0.1.0"
description = "YUI Mod — see the screen and open/close apps on the macOS host"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.2.4",
    "loguru>=0.7",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
]

[project.scripts]
desktop-control-mcp = "desktop_control.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["desktop_control"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
