[mod-name]
coop-agent=Co-op Agent

[mod-description]
coop-agent=Co-play observation, RPC transport and a playerless body for a remote agent.

[controls]
coop-agent-stop=Stop the body

[mod-setting-name]
coop-agent-body-name=Body name
coop-agent-body-enabled=Body enabled
coop-agent-body-prototype=Body prototype
coop-agent-body-color=Body color
coop-agent-idle-start=Idle start mode

[mod-setting-description]
coop-agent-body-name=Name prefixed to every chat line the say op sends and shown on the body's status line.
coop-agent-body-enabled=Spawn the body beside the host and keep it alive. Off removes the body.
coop-agent-body-prototype=Character prototype the body spawns as; an unknown name spawns a plain character.
coop-agent-body-color=Color of the body.
coop-agent-idle-start=Mode the body starts in: follow keeps it 10 to 15 tiles from the host, stay stands where it is.
