[project]
name = "mods-router"
version = "0.1.0"
description = "YUI Mods router — one HTTP front door path-routing to independent mod processes"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "starlette",
    "uvicorn",
]

[project.scripts]
mods-router = "router.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["router"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
