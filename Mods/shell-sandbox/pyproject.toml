[project]
name = "shell-sandbox"
version = "0.1.0"
description = "YUI Mod — an unrestricted shell over a mounted volume, run inside a container"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.2.4",
    "loguru>=0.7",
]

[project.scripts]
shell-sandbox-mcp = "shell_sandbox.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shell_sandbox"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
