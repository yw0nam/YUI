# Containerizable Mods, built and deployed together.
#   docker compose up -d --build
# desktop-control and the router are NOT here: desktop-control is host-native
# (needs the Mac GUI) and the router is a host-side proxy (`uv run mods-router`)
# that reaches each mod on 127.0.0.1. Each mod is a self-contained uv project;
# its build context is its own folder with its own pyproject/uv.lock/Dockerfile.

services:
  shell-sandbox:
    build:
      context: ./shell-sandbox
      dockerfile: Dockerfile
    image: yui-shell-sandbox
    # Loopback only — reach from the remote agent via SSH reverse tunnel, never 0.0.0.0.
    ports:
      - "127.0.0.1:9001:9001"
    # The only reachable host state, writable. Set SHELL_SANDBOX_MOUNT to the dir
    # you want the agent to touch; defaults to a scratch ./work so originals are safe.
    volumes:
      - "${SHELL_SANDBOX_MOUNT:-./work}:/work"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
