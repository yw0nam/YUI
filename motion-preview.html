<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Motion Preview — YUI Dev Inspector</title>
  </head>
  <body>

    <div class="shell">

      <!-- VRM Viewport (three.js canvas mounts here) -->
      <div class="viewport">
        <div class="viewport-label">VRM Viewport — carlotta.vrm</div>
        <div id="vrm-mount" style="position:absolute;inset:0;"></div>
        <div class="viewport-status" id="viewport-status">idle &middot; 0fps</div>
      </div>

      <!-- Control Rail -->
      <div class="rail">
        <div class="rail-scroll">

          <!-- REGISTRY section -->
          <div class="section">
            <div class="section-header">
              <span class="section-label">Registry</span>
              <div class="section-divider"></div>
            </div>
            <div id="registry-list"></div>
          </div>

          <div class="section-sep"></div>

          <!-- PLAYBACK section -->
          <div class="playback-section">
            <div class="section-header">
              <span class="section-label">Playback</span>
              <div class="section-divider"></div>
            </div>

            <!-- loop checkbox -->
            <div class="playback-row">
              <span class="playback-label">loop</span>
              <div class="playback-control">
                <label class="cb-wrap">
                  <input type="checkbox" id="cb-loop" checked />
                  <span class="cb-label">enabled</span>
                </label>
              </div>
            </div>

            <!-- speed slider -->
            <div class="playback-row">
              <span class="playback-label">speed</span>
              <div class="playback-control">
                <div class="slider-wrap">
                  <input type="range" id="sl-speed" min="0.25" max="2.5" step="0.05" value="1.0" />
                  <span class="slider-value" id="val-speed">1x</span>
                </div>
              </div>
            </div>

            <!-- fade slider -->
            <div class="playback-row">
              <span class="playback-label">fade</span>
              <div class="playback-control">
                <div class="slider-wrap">
                  <input type="range" id="sl-fade" min="0" max="600" step="10" value="200" />
                  <span class="slider-value" id="val-fade">200ms</span>
                </div>
              </div>
            </div>

            <!-- crossfade dropdown -->
            <div class="playback-row">
              <span class="playback-label">crossfade &#8594;</span>
              <div class="playback-control">
                <select id="sel-crossfade"></select>
              </div>
            </div>

            <!-- action buttons -->
            <div class="btn-row">
              <button class="btn btn-primary" id="btn-play">play</button>
              <button class="btn btn-stop" id="btn-stop">stop</button>
              <button class="btn btn-idle" id="btn-idle">&#8594; idle</button>
            </div>
          </div>

        </div><!-- /rail-scroll -->

        <!-- Status bar pinned at bottom of rail -->
        <div class="status-bar">
          <span class="status-text">
            <span class="status-key">now: </span><span class="status-accent" id="status-now">loading</span>
            <span class="status-key"> &middot; </span><span class="status-val" id="status-kind">-</span>
            <span class="status-key"> &middot; </span><span class="status-val" id="status-priority">-</span>
            <span class="status-key"> &middot; </span><span class="status-val" id="status-elapsed">0.0s</span>
            <span class="status-key"> &middot; </span><span class="status-val" id="status-fps">0fps</span>
          </span>
        </div>

      </div><!-- /rail -->
    </div><!-- /shell -->

    <script type="module" src="/src/dev/motion-preview.ts"></script>
  </body>
</html>
