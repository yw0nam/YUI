[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# macos-private-api: tauri.conf.json app.macOSPrivateApi=true (투명 창) 필수 feature.
tauri = { version = "2.11.2", features = ["macos-private-api"] }
tauri-plugin-log = "2"
# HTTP plugin (issue #39): routes requests through Rust → no Origin header → bypasses Hermes CORS/403.
# JS side: `@tauri-apps/plugin-http` fetch injected into `new OpenAI({ fetch })`. (D-TAURI-FETCH)
tauri-plugin-http = "2"
