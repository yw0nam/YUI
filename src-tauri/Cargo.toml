[package]
name = "app"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# 로그 타임스탬프 타임존 변환용(UtcOffset / OffsetDateTime). local-offset feature는 불필요.
time = "0.3"
# macos-private-api: tauri.conf.json app.macOSPrivateApi=true (투명 창) 필수 feature.
# protocol-asset: app.security.assetProtocol.enable=true (번들 리소스 convertFileSrc) 필수 feature.
tauri = { version = "2.11.2", features = ["macos-private-api", "protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-cors-fetch = "5.0.0"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
xcap = "0.4.1"
image = { version = "0.25", features = ["jpeg"], default-features = false }
base64 = "0.22"
tiny_http = "0.12"

# Windows OS API bindings (cfg-gated, compile-only on Windows)
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_HiDpi"] }

# macOS OS API bindings (cfg-gated, compile-only on other platforms)
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25.0", features = ["highsierra"] }
core-foundation = "0.10.1"
