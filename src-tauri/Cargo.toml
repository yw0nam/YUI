[package]
name = "app"
version = "0.4.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.89"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# Converts log timestamps to the configured timezone (UtcOffset / OffsetDateTime); the local-offset feature is not needed.
time = "0.3"
# macos-private-api: required by app.macOSPrivateApi=true in tauri.conf.json (transparent window).
# protocol-asset: required by app.security.assetProtocol.enable=true (bundled resources via convertFileSrc).
tauri = { version = "2.11.2", features = ["macos-private-api", "protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-cors-fetch = "5.0.0"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
image = { version = "0.25", features = ["jpeg"], default-features = false }
base64 = "0.22"
tiny_http = "0.12"

# Desktop-only crates: neither has an Android/iOS implementation.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
xcap = "0.4.1"
# The `browser` tool drives a dedicated Chrome over CDP.
chromiumoxide = "0.9.1"
futures = "0.3"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
url = "2"

# Hostname and pid liveness for Chrome's profile singleton check.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows OS API bindings (cfg-gated, compile-only on Windows)
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_HiDpi"] }

# macOS OS API bindings (cfg-gated, compile-only on other platforms)
[target.'cfg(target_os = "macos")'.dependencies]
# Runtime NSWindow subclassing to lift constrainFrameRect:toScreen: (window_frame.rs).
# Versions pinned to what tao already resolves in Cargo.lock — no new crates downloaded.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSScreen"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }

# The screenshot resize and JPEG encode run in these two crates.
[profile.dev.package.app]
opt-level = 1

[profile.dev.package.image]
opt-level = 3
