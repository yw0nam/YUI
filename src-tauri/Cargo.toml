[package]
name = "app"
version = "0.5.0"
description = "YUI desktop companion: VRM character window and desktop-pet shell"
authors = ["YoungWoo Nam"]
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/yw0nam/YUI"
edition = "2021"
rust-version = "1.89"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# Converts log timestamps to the configured timezone (UtcOffset / OffsetDateTime); the local-offset feature is not needed.
time = "0.3"
# macos-private-api: required by app.macOSPrivateApi=true in tauri.conf.json (transparent window).
# protocol-asset: required by app.security.assetProtocol.enable=true (bundled resources via convertFileSrc).
tauri = { version = "2.11.2", features = ["macos-private-api", "protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-cors-fetch = "5.0.0"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
image = { version = "0.25", features = ["jpeg", "png"], default-features = false }
base64 = "0.22"
tiny_http = "0.12"
tauri-plugin-global-shortcut = "2"
xcap = "0.4.1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tauri-plugin-wdio-webdriver = { version = "1.5.0", optional = true }
rmcp = { version = "3.8", default-features = false, features = ["client", "transport-async-rw"] }
process-wrap = { version = "10.0", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop", "creation-flags"] }
# Keeps `.mcp.json` servers in file order.
indexmap = { version = "2", features = ["serde"] }
# Catalog fetch and plugin downloads; default features keep the rustls stack tauri-plugin-cors-fetch already uses.
reqwest = "0.13"
sha2 = "0.10"
# Unpacks plugin release zips, which are deflated.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Kills an MCP server's whole process group; the major version process-wrap uses.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal"] }

[features]
# Embedded WebDriver server on 127.0.0.1:4445 for the verify bundle.
verify = ["dep:tauri-plugin-wdio-webdriver"]

# Windows OS API bindings (cfg-gated, compile-only on Windows)
[target.'cfg(target_os = "windows")'.dependencies]
# The windows version process-wrap's CreationFlags takes its PROCESS_CREATION_FLAGS from.
windows-process = { package = "windows", version = "0.62", features = ["Win32_System_Threading"] }
windows = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_HiDpi"] }

# macOS OS API bindings (cfg-gated, compile-only on other platforms)
[target.'cfg(target_os = "macos")'.dependencies]
# Runtime NSWindow subclassing to lift constrainFrameRect:toScreen: (window_frame.rs) and the
# quick card's child-window link (quick_card_dock.rs).
# Versions pinned to what tao already resolves in Cargo.lock — no new crates downloaded.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSScreen", "NSGraphics"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }

# Release builds use Cargo's default profile; LTO and strip are unmeasured for this app, so nothing is tuned.
# The screenshot resize and JPEG encode run in these two crates.
[profile.dev.package.app]
opt-level = 1

[profile.dev.package.image]
opt-level = 3
