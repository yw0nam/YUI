<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YUI · 스크린샷 컨트롤 mock (issue #20)</title>
    <style>
      /* ════════════════════════════════════════════════════════════
         YUI design tokens — "The Hearthlight" (src/ui/tokens.css 미러)
         OKLCH only · no #000/#fff · 모든 중립은 앰버 hue(~72)로 미세 틴트.
         이 mock은 승인용 standalone — 실제 토큰값을 그대로 인라인한다.
         ════════════════════════════════════════════════════════════ */
      :root {
        --yui-accent: oklch(0.8 0.13 75);
        --yui-accent-soft: oklch(0.8 0.13 75 / 0.45);
        --yui-accent-faint: oklch(0.8 0.13 75 / 0.16);

        --yui-text: oklch(0.95 0.012 80);
        --yui-text-dim: oklch(0.78 0.016 75);
        --yui-text-mute: oklch(0.66 0.014 72);

        --yui-scrim: oklch(0.21 0.014 70 / 0.64);
        --yui-scrim-strong: oklch(0.19 0.014 70 / 0.86);
        --yui-edge: oklch(0.97 0.01 80 / 0.1);
        --yui-edge-strong: oklch(0.97 0.01 80 / 0.16);

        --yui-float: 0 8px 32px oklch(0.12 0.02 70 / 0.4);
        --yui-text-shadow: 0 1px 2px oklch(0.1 0.01 70 / 0.55);

        --yui-radius: 14px;
        --yui-radius-input: 12px;
        --yui-radius-row: 10px;
        --yui-radius-chip: 999px;

        --yui-ease: cubic-bezier(0.22, 1, 0.36, 1);
        --yui-dur: 200ms;
        --yui-dur-fast: 140ms;

        --yui-font: system-ui, -apple-system, "Segoe UI", "Pretendard",
          "Apple SD Gothic Neo", sans-serif;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: var(--yui-font);
      }

      /* ── 데스크톱 시뮬레이션 (legible-on-anything 검증용) ───────────
         실제 제품에선 투명 창. 여기선 임의 배경을 깔아 scrim 가독을 본다. */
      .desk {
        position: fixed;
        inset: 0;
        overflow: hidden;
        --busy: 1;
      }
      .desk[data-bg="dark"] {
        background: oklch(0.24 0.02 265);
      }
      .desk[data-bg="light"] {
        background: oklch(0.96 0.01 250);
      }
      .desk[data-bg="busy"] {
        background:
          radial-gradient(120% 90% at 12% 8%, oklch(0.93 0.05 95) 0%, transparent 42%),
          radial-gradient(120% 120% at 92% 18%, oklch(0.62 0.16 28) 0%, transparent 40%),
          radial-gradient(100% 120% at 80% 95%, oklch(0.55 0.13 250) 0%, transparent 45%),
          linear-gradient(160deg, oklch(0.34 0.06 280), oklch(0.2 0.03 250));
      }
      /* busy 배경 위 가짜 창 — 밝은 영역/어두운 영역 동시 노출로 가독 입증 */
      .fake-window {
        position: absolute;
        border-radius: 12px;
        box-shadow: 0 10px 40px oklch(0.1 0.02 270 / 0.4);
        display: none;
      }
      .desk[data-bg="busy"] .fake-window {
        display: block;
      }
      .fake-window.light {
        inset: 12% auto auto 6%;
        width: 33%;
        height: 46%;
        background: oklch(0.97 0.006 250);
        border: 1px solid oklch(0.85 0.01 250);
      }
      .fake-window.code {
        inset: auto 5% 9% auto;
        width: 36%;
        height: 50%;
        background: oklch(0.19 0.02 265);
        border: 1px solid oklch(0.32 0.02 265);
      }
      .fake-window .bar {
        height: 26px;
        border-radius: 12px 12px 0 0;
        display: flex;
        gap: 6px;
        align-items: center;
        padding: 0 10px;
      }
      .fake-window.light .bar {
        background: oklch(0.92 0.01 250);
      }
      .fake-window.code .bar {
        background: oklch(0.24 0.02 265);
      }
      .fake-window .bar i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: oklch(0.7 0.02 250 / 0.6);
      }
      .fake-window .lines {
        padding: 14px;
        display: grid;
        gap: 9px;
      }
      .fake-window .lines span {
        height: 9px;
        border-radius: 4px;
      }
      .fake-window.light .lines span {
        background: oklch(0.84 0.01 250);
      }
      .fake-window.code .lines span {
        background: oklch(0.3 0.03 265);
      }

      /* ── 캐릭터 플레이스홀더 (위치 앵커 확인용, 렌더 아님) ─────────── */
      .stage-char {
        position: absolute;
        left: 50%;
        bottom: 0;
        transform: translateX(-50%);
        width: min(46vh, 420px);
        height: 86%;
        background:
          radial-gradient(60% 30% at 50% 16%, oklch(0.85 0.03 75 / 0.22), transparent 70%),
          linear-gradient(
            to top,
            oklch(0.8 0.04 75 / 0.16),
            oklch(0.8 0.04 75 / 0.05) 55%,
            transparent 78%
          );
        border-radius: 46% 46% 0 0 / 30% 30% 0 0;
        filter: blur(2px);
      }
      .stage-char::after {
        content: "캐릭터 (VRM)";
        position: absolute;
        top: 12%;
        left: 50%;
        transform: translateX(-50%);
        color: oklch(0.96 0.01 80 / 0.5);
        font-size: 0.72rem;
        letter-spacing: 0.06em;
        text-shadow: var(--yui-text-shadow);
        white-space: nowrap;
        filter: blur(0);
      }

      /* ════════════════════════════════════════════════════════════
         R7 capture indicator — ON일 때 항상 떠 있는 작은 tell.
         "지금 화면이 첨부되고 있다"는 프라이버시 양심. 차분하되 분명히.
         ════════════════════════════════════════════════════════════ */
      .yui-capture {
        position: absolute;
        top: 4.5%;
        left: 50%;
        transform: translate(-50%, 0);
        display: inline-flex;
        align-items: center;
        gap: 0.46rem;
        padding: 0.3rem 0.66rem 0.3rem 0.56rem;
        border-radius: var(--yui-radius-chip);
        background: var(--yui-scrim);
        border: 1px solid var(--yui-edge);
        box-shadow: var(--yui-float);
        backdrop-filter: blur(10px) saturate(1.1);
        -webkit-backdrop-filter: blur(10px) saturate(1.1);
        color: var(--yui-text-dim);
        font-size: 0.76rem;
        font-weight: 500;
        letter-spacing: 0.01em;
        white-space: nowrap;
        text-shadow: var(--yui-text-shadow);
        cursor: pointer;
        user-select: none;
        transition:
          opacity var(--yui-dur) var(--yui-ease),
          transform var(--yui-dur) var(--yui-ease),
          border-color var(--yui-dur-fast) var(--yui-ease);
      }
      .yui-capture:hover {
        border-color: var(--yui-edge-strong);
      }
      .yui-capture[hidden] {
        display: none;
      }
      .yui-capture__view {
        width: 0.92rem;
        height: 0.92rem;
        color: var(--yui-text-dim);
        flex: 0 0 auto;
      }
      /* live tell — 작은 앰버 점 하나의 calm pulse (점이지 면이 아님) */
      .yui-capture__live {
        width: 0.4rem;
        height: 0.4rem;
        border-radius: 50%;
        background: var(--yui-accent);
        box-shadow: 0 0 0 0 var(--yui-accent-soft);
        flex: 0 0 auto;
        animation: yui-live 1.8s var(--yui-ease) infinite;
      }
      @keyframes yui-live {
        0%,
        100% {
          opacity: 0.45;
          box-shadow: 0 0 0 0 var(--yui-accent-soft);
        }
        50% {
          opacity: 1;
          box-shadow: 0 0 0 3px oklch(0.8 0.13 75 / 0);
        }
      }

      /* ════════════════════════════════════════════════════════════
         Quick-controls 팝오버 — 4번째 Hearthlight 표면.
         캐릭터 우클릭으로 소환(제안). 앵커된 패널, 모달 아님. 바깥클릭/Esc로 닫힘.
         ════════════════════════════════════════════════════════════ */
      .yui-quick {
        position: absolute;
        left: 50%;
        bottom: 9%;
        transform: translate(-50%, 8px) scale(0.985);
        width: min(20rem, 86vw);
        padding: 0.85rem 0.85rem 0.7rem;
        border-radius: var(--yui-radius);
        background: var(--yui-scrim-strong);
        border: 1px solid var(--yui-edge);
        box-shadow: var(--yui-float);
        backdrop-filter: blur(14px) saturate(1.12);
        -webkit-backdrop-filter: blur(14px) saturate(1.12);
        color: var(--yui-text);
        text-shadow: var(--yui-text-shadow);
        opacity: 0;
        transition:
          opacity var(--yui-dur) var(--yui-ease),
          transform var(--yui-dur) var(--yui-ease);
      }
      .yui-quick.is-open {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }

      .yui-quick__eyebrow {
        display: block;
        margin: 0 0.15rem 0.6rem;
        font-size: 0.68rem;
        font-weight: 600;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--yui-text-mute);
      }

      /* 토글 행 — 라벨/서브 + 스위치 */
      .yui-row {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.5rem 0.55rem;
        border-radius: var(--yui-radius-row);
        transition: background var(--yui-dur-fast) var(--yui-ease);
      }
      .yui-row:hover {
        background: oklch(0.97 0.01 80 / 0.05);
      }
      .yui-row__main {
        flex: 1;
        min-width: 0;
      }
      .yui-row__label {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.92rem;
        font-weight: 550;
        line-height: 1.2;
      }
      .yui-row__label svg {
        width: 0.95rem;
        height: 0.95rem;
        color: var(--yui-text-dim);
        flex: 0 0 auto;
      }
      .yui-row__sub {
        margin-top: 0.18rem;
        font-size: 0.74rem;
        line-height: 1.35;
        color: var(--yui-text-mute);
      }

      /* 스위치 — OFF=차분, ON=앰버 점화(warmth 순간) */
      .yui-switch {
        --w: 2.5rem;
        --h: 1.45rem;
        position: relative;
        flex: 0 0 auto;
        width: var(--w);
        height: var(--h);
        border: 0;
        padding: 0;
        border-radius: 999px;
        background: oklch(0.5 0.01 70 / 0.35);
        cursor: pointer;
        transition:
          background var(--yui-dur) var(--yui-ease),
          box-shadow var(--yui-dur-fast) var(--yui-ease);
      }
      .yui-switch::after {
        content: "";
        position: absolute;
        top: 0.18rem;
        left: 0.18rem;
        width: calc(var(--h) - 0.36rem);
        height: calc(var(--h) - 0.36rem);
        border-radius: 50%;
        background: oklch(0.96 0.01 80);
        box-shadow: 0 1px 3px oklch(0.1 0.01 70 / 0.5);
        transition: transform var(--yui-dur) var(--yui-ease);
      }
      .yui-switch[aria-checked="true"] {
        background: var(--yui-accent);
      }
      .yui-switch[aria-checked="true"]::after {
        transform: translateX(calc(var(--w) - var(--h)));
      }
      .yui-switch:focus-visible {
        outline: none;
        box-shadow: 0 0 0 2px var(--yui-accent-soft);
      }

      /* 소스 섹션 — ON일 때만 펼침 */
      .yui-source {
        overflow: hidden;
        max-height: 0;
        opacity: 0;
        transition:
          max-height var(--yui-dur) var(--yui-ease),
          opacity var(--yui-dur) var(--yui-ease);
      }
      .yui-quick.is-on .yui-source {
        max-height: 16rem;
        opacity: 1;
      }
      .yui-source__label {
        margin: 0.5rem 0.6rem 0.35rem;
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        color: var(--yui-text-mute);
      }
      .yui-monitors {
        display: grid;
        gap: 0.25rem;
      }
      /* 모니터 옵션 (radio) */
      .yui-mon {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.5rem 0.6rem;
        border: 0;
        width: 100%;
        text-align: left;
        background: transparent;
        border-radius: var(--yui-radius-row);
        color: var(--yui-text);
        font-family: inherit;
        cursor: pointer;
        transition: background var(--yui-dur-fast) var(--yui-ease);
      }
      .yui-mon:hover {
        background: oklch(0.97 0.01 80 / 0.06);
      }
      .yui-mon__tick {
        width: 1.1rem;
        height: 1.1rem;
        border-radius: 50%;
        border: 1.5px solid var(--yui-text-mute);
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        transition:
          border-color var(--yui-dur-fast) var(--yui-ease),
          background var(--yui-dur-fast) var(--yui-ease);
      }
      .yui-mon__tick::after {
        content: "";
        width: 0.46rem;
        height: 0.46rem;
        border-radius: 50%;
        background: oklch(0.99 0.01 80);
        transform: scale(0);
        transition: transform var(--yui-dur-fast) var(--yui-ease);
      }
      .yui-mon[aria-checked="true"] .yui-mon__tick {
        border-color: var(--yui-accent);
        background: var(--yui-accent);
      }
      .yui-mon[aria-checked="true"] .yui-mon__tick::after {
        transform: scale(1);
      }
      .yui-mon__body {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: baseline;
        gap: 0.5rem;
      }
      .yui-mon__name {
        font-size: 0.88rem;
        font-weight: 500;
      }
      .yui-mon__meta {
        font-size: 0.72rem;
        color: var(--yui-text-mute);
      }
      .yui-mon__badge {
        margin-left: auto;
        font-size: 0.64rem;
        letter-spacing: 0.04em;
        color: var(--yui-text-dim);
        padding: 0.1rem 0.4rem;
        border-radius: 999px;
        border: 1px solid var(--yui-edge);
        white-space: nowrap;
      }

      .yui-quick__foot {
        margin: 0.55rem 0.6rem 0.1rem;
        font-size: 0.71rem;
        line-height: 1.4;
        color: var(--yui-text-mute);
      }
      .yui-quick.is-on .yui-quick__foot--off,
      .yui-quick:not(.is-on) .yui-quick__foot--on {
        display: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .yui-quick,
        .yui-capture,
        .yui-switch,
        .yui-switch::after,
        .yui-source,
        .yui-mon__tick::after {
          transition-duration: var(--yui-dur-fast) !important;
        }
        .yui-quick {
          transform: translate(-50%, 0) !important;
        }
        .yui-capture__live {
          animation: none !important;
        }
      }

      /* ════════════════════════════════════════════════════════════
         MOCK 전용 컨트롤 (제품 UI 아님 — 일부러 plain하게)
         ════════════════════════════════════════════════════════════ */
      .mockbar {
        position: fixed;
        left: 16px;
        top: 16px;
        z-index: 50;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 12px 13px;
        width: 220px;
        background: oklch(0.16 0.005 270 / 0.92);
        border: 1px solid oklch(0.5 0.01 270 / 0.4);
        border-radius: 10px;
        color: oklch(0.92 0.005 270);
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .mockbar h2 {
        margin: 0;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: oklch(0.7 0.01 270);
      }
      .mockbar .grp {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .mockbar button {
        flex: 1;
        padding: 6px 8px;
        background: oklch(0.26 0.01 270);
        border: 1px solid oklch(0.45 0.01 270 / 0.5);
        border-radius: 6px;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .mockbar button[aria-pressed="true"] {
        background: oklch(0.5 0.12 75);
        border-color: oklch(0.6 0.12 75);
        color: oklch(0.16 0.02 75);
      }
      .mockbar .hint {
        color: oklch(0.66 0.01 270);
        font-size: 11px;
      }
      .mockbar a {
        color: oklch(0.8 0.1 75);
      }
    </style>
  </head>
  <body>
    <div class="desk" data-bg="busy" id="desk">
      <div class="fake-window light">
        <div class="bar"><i></i><i></i><i></i></div>
        <div class="lines">
          <span style="width: 80%"></span><span style="width: 60%"></span>
          <span style="width: 72%"></span><span style="width: 45%"></span>
        </div>
      </div>
      <div class="fake-window code">
        <div class="bar"><i></i><i></i><i></i></div>
        <div class="lines">
          <span style="width: 55%"></span><span style="width: 78%"></span>
          <span style="width: 40%"></span><span style="width: 66%"></span>
        </div>
      </div>

      <div class="stage-char"></div>

      <!-- R7 capture indicator -->
      <button class="yui-capture" id="capture" type="button" aria-live="polite">
        <svg class="yui-capture__view" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M4 8.5V6a2 2 0 0 1 2-2h2.5M15.5 4H18a2 2 0 0 1 2 2v2.5M20 15.5V18a2 2 0 0 1-2 2h-2.5M8.5 20H6a2 2 0 0 1-2-2v-2.5"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />
          <circle cx="12" cy="12" r="2.4" stroke="currentColor" stroke-width="1.7" />
        </svg>
        <span>화면 보는 중</span>
        <span class="yui-capture__live" aria-hidden="true"></span>
      </button>

      <!-- Quick-controls 팝오버 -->
      <div class="yui-quick is-open is-on" id="quick" role="dialog" aria-label="빠른 설정">
        <span class="yui-quick__eyebrow">빠른 설정</span>

        <div class="yui-row">
          <div class="yui-row__main">
            <span class="yui-row__label">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="3" y="5" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.7" />
                <path d="M3 9h18" stroke="currentColor" stroke-width="1.7" />
              </svg>
              스크린샷 첨부
            </span>
            <span class="yui-row__sub">대화할 때 화면을 함께 봐요</span>
          </div>
          <button
            class="yui-switch"
            id="toggle"
            type="button"
            role="switch"
            aria-checked="true"
            aria-label="스크린샷 첨부"
          ></button>
        </div>

        <div class="yui-source" id="source">
          <div class="yui-source__label">보낼 화면</div>
          <div class="yui-monitors" id="monitors" role="radiogroup" aria-label="보낼 화면">
            <button class="yui-mon" type="button" role="radio" aria-checked="true">
              <span class="yui-mon__tick" aria-hidden="true"></span>
              <span class="yui-mon__body">
                <span class="yui-mon__name">디스플레이 1</span>
                <span class="yui-mon__meta">2560 × 1440</span>
              </span>
              <span class="yui-mon__badge">주 화면</span>
            </button>
            <button class="yui-mon" type="button" role="radio" aria-checked="false">
              <span class="yui-mon__tick" aria-hidden="true"></span>
              <span class="yui-mon__body">
                <span class="yui-mon__name">디스플레이 2</span>
                <span class="yui-mon__meta">1920 × 1080</span>
              </span>
            </button>
          </div>
        </div>

        <p class="yui-quick__foot yui-quick__foot--on">
          켜져 있는 동안 매 대화에 이 화면이 첨부돼요.
        </p>
        <p class="yui-quick__foot yui-quick__foot--off">
          기본은 꺼져 있어요. 켜면 화면을 함께 보내요.
        </p>
      </div>
    </div>

    <!-- MOCK 전용 -->
    <div class="mockbar">
      <h2>Mock · issue #20</h2>
      <div class="grp" role="group" aria-label="배경">
        <button data-bg="busy" aria-pressed="true">바쁜 배경</button>
        <button data-bg="dark" aria-pressed="false">다크</button>
        <button data-bg="light" aria-pressed="false">라이트</button>
      </div>
      <div class="grp">
        <button id="mock-toggle">토글 ON/OFF</button>
        <button id="mock-quick">팝오버 열기/닫기</button>
      </div>
      <p class="hint">
        제안: 캐릭터 <b>우클릭</b> → 빠른 설정. ON이면 상단에 <b>화면 보는 중</b> tell이 늘 떠 있음(R7).
        인디케이터 클릭 = 빠른 설정 다시 열기.
      </p>
    </div>

    <script>
      const desk = document.getElementById("desk");
      const quick = document.getElementById("quick");
      const toggle = document.getElementById("toggle");
      const capture = document.getElementById("capture");
      const monitors = document.getElementById("monitors");

      function setOn(on) {
        toggle.setAttribute("aria-checked", String(on));
        quick.classList.toggle("is-on", on);
        capture.hidden = !on;
      }
      setOn(true);

      toggle.addEventListener("click", () =>
        setOn(toggle.getAttribute("aria-checked") !== "true"),
      );

      monitors.querySelectorAll(".yui-mon").forEach((mon) => {
        mon.addEventListener("click", () => {
          monitors
            .querySelectorAll(".yui-mon")
            .forEach((m) => m.setAttribute("aria-checked", "false"));
          mon.setAttribute("aria-checked", "true");
        });
      });

      capture.addEventListener("click", () => quick.classList.add("is-open"));

      // mock controls
      document.querySelectorAll(".mockbar [data-bg]").forEach((b) => {
        b.addEventListener("click", () => {
          desk.dataset.bg = b.dataset.bg;
          document
            .querySelectorAll(".mockbar [data-bg]")
            .forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
        });
      });
      document
        .getElementById("mock-toggle")
        .addEventListener("click", () =>
          setOn(toggle.getAttribute("aria-checked") !== "true"),
        );
      document
        .getElementById("mock-quick")
        .addEventListener("click", () => quick.classList.toggle("is-open"));
    </script>
  </body>
</html>
